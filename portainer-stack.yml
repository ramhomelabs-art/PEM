version: '3.8'

# ==============================================================================
# PEM FINANCE & AUTOMATION - PORTAINER PRODUCTION STACK
# ==============================================================================
# Designed specifically for Portainer (avoids Portainer Agent BuildKit gRPC errors)
#
# Prerequisite: Ensure the images are built on the host via:
#   docker compose build
#
# Then paste this stack directly into Portainer Web Editor or deploy via Stacks.
# ==============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: pem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-expense_manager}
      POSTGRES_USER: ${DB_USER:-pem_admin}
      POSTGRES_PASSWORD: ${DB_PASS:-pem_secure_password_2026}
    volumes:
      - pem_pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pem_admin} -d ${DB_NAME:-expense_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pem_network

  python-service:
    image: pem-python-extraction:latest
    container_name: pem_python_service
    restart: unless-stopped
    ports:
      - "${PYTHON_PORT:-5002}:5002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pem_network

  backend:
    image: pem-backend:latest
    container_name: pem_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      python-service:
        condition: service_started
    environment:
      PORT: 5005
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-expense_manager}
      DB_USER: ${DB_USER:-pem_admin}
      DB_PASS: ${DB_PASS:-pem_secure_password_2026}
      JWT_SECRET: ${JWT_SECRET:-c296d24e8bb618b342c5610b1cbee2e585eb3566edb0448e1e83b4f222666f16}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5174}
      PYTHON_SERVICE_URL: http://python-service:5002
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5174/credit-cards/auto-statement}
      PEM_QR_PAIRING_SECRET: ${PEM_QR_PAIRING_SECRET:-f0dbde8b909d58ecc08257c6335035aa379db2c11c2464d6295b9f1aa5409402}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-12345678901234567890123456789012}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    volumes:
      - pem_uploads:/app/uploads
      - pem_storage:/app/storage
    ports:
      - "${BACKEND_PORT:-5005}:5005"
    networks:
      - pem_network

  frontend:
    image: pem-frontend:latest
    container_name: pem_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    networks:
      - pem_network

volumes:
  pem_pg_data:
    name: pem_pg_data
  pem_uploads:
    name: pem_uploads
  pem_storage:
    name: pem_storage

networks:
  pem_network:
    name: pem_network
    driver: bridge
