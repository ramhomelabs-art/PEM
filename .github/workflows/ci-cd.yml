name: PEM CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Test & Build Client & Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install & Build Client
        run: |
          cd client
          npm ci
          npm run build

      - name: Install & Test Server
        run: |
          cd server
          npm ci

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

  docker-build:
    name: Build Docker Container Images
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: pem-frontend:latest

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: pem-backend:latest

      - name: Build Python Extraction Image
        uses: docker/build-push-action@v5
        with:
          context: ./python-extraction-service
          file: ./python-extraction-service/Dockerfile
          push: false
          tags: pem-python-extraction:latest

      - name: Portainer Stack Webhook Trigger (Optional)
        if: env.PORTAINER_WEBHOOK_URL != ''
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" || echo "Portainer webhook triggered"
