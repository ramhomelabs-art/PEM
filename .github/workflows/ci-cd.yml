name: PEM CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  validate-and-build:
    name: Test & Build Client & Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install & Build Client
        run: |
          cd client
          npm ci
          npm run build

      - name: Install & Test Server
        run: |
          cd server
          npm ci

      - name: Validate Docker Compose Configuration
        run: |
          touch .env
          docker compose config --quiet

  docker-build:
    name: Build & Push Docker Container Images
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/pem-frontend:latest
            ${{ env.IMAGE_PREFIX }}/pem-frontend:${{ github.sha }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/pem-backend:latest
            ${{ env.IMAGE_PREFIX }}/pem-backend:${{ github.sha }}

      - name: Build & Push Python Extraction Image
        uses: docker/build-push-action@v5
        with:
          context: ./python-extraction-service
          file: ./python-extraction-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/pem-python-extraction:latest
            ${{ env.IMAGE_PREFIX }}/pem-python-extraction:${{ github.sha }}

      - name: Portainer Stack Webhook Trigger (Optional)
        if: ${{ secrets.PORTAINER_WEBHOOK_URL != '' }}
        run: |
          curl -s -S -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" || echo "Portainer webhook triggered"
